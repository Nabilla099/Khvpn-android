name: Build Web App

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # bun.lock kosong & tidak ada package-lock.json, jadi pakai npm install (bukan npm ci)
      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Type check
        run: npm run lint
        continue-on-error: true

      - name: Build
        run: npm run build -- --base=./

      - name: Upload dist (bisa diunduh dari halaman run)
        uses: actions/upload-artifact@v4
        with:
          name: kh-vpn-dist
          path: dist
          retention-days: 14

      - name: Siapkan artifact GitHub Pages
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
